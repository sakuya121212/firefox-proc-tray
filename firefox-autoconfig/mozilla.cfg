// FirefoxProcTray: autoconfig ignores the first line of this file
// Writes a PID -> tab title mapping (no URLs) to %LOCALAPPDATA%\FirefoxProcTray\procinfo.json every 2 seconds.
(function () {
  const Cc = Components.classes, Ci = Components.interfaces;
  const INTERVAL_MS = 2000;
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const wm = Cc["@mozilla.org/appshell/window-mediator;1"].getService(Ci.nsIWindowMediator);
  const consoleSvc = Cc["@mozilla.org/consoleservice;1"].getService(Ci.nsIConsoleService);
  const dir = env.get("LOCALAPPDATA") + "\\FirefoxProcTray";
  const file = dir + "\\procinfo.json";
  let busy = false;

  function isPrivate(win) {
    try { return win.docShell.QueryInterface(Ci.nsILoadContext).usePrivateBrowsing; } catch (e) { return false; }
  }

  async function snapshot() {
    const wins = [...wm.getEnumerator("navigator:browser")].filter(w => w.gBrowser);
    if (!wins.length) return;
    // The autoconfig scope lacks ChromeUtils / IOUtils, so borrow them from a browser window
    const g = wins[0];
    const titles = new Map();  // browser.outerWindowID -> tab label (same mapping as about:processes)
    for (const w of wins) {
      const priv = isPrivate(w);
      for (const b of w.gBrowser.browsers) {
        const tab = w.gBrowser.getTabForBrowser(b);
        if (tab) titles.set(b.outerWindowID, priv ? "(private)" : tab.label);
      }
    }
    const info = await g.ChromeUtils.requestProcInfo();
    const processes = [{ pid: info.pid, type: info.type, tabs: [], frames: 0 }];
    for (const c of info.children) {
      const tabs = [];
      let frames = 0;
      for (const win of c.windows) {
        if (titles.has(win.outerWindowId)) tabs.push(titles.get(win.outerWindowId));
        else if (win.isProcessRoot) frames++;
      }
      processes.push({ pid: c.pid, type: c.type, tabs, frames });
    }
    await g.IOUtils.makeDirectory(dir, { ignoreExisting: true });
    await g.IOUtils.writeJSON(file, { updated: Date.now(), processes }, { tmpPath: file + ".tmp" });
  }

  const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  timer.initWithCallback({
    notify() {
      if (busy) return;
      busy = true;
      snapshot()
        .catch(e => consoleSvc.logStringMessage("FirefoxProcTray: " + e))
        .finally(() => { busy = false; });
    }
  }, INTERVAL_MS, Ci.nsITimer.TYPE_REPEATING_SLACK);
  // Keep a reference so the repeating timer is not garbage collected
  globalThis.__firefoxProcTrayTimer = timer;
})();
